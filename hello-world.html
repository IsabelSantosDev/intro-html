<!-- DOCTYPE - Serve para indicar para os navegadores qual versão do HTML está sendo utilizada -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz da página. Tudo que pertence ao documento HTML fica dentro dele -->

<html lang="pt-BR">
<head>
    <!--charset - serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite utilizar caracteres especiais e emojis. -->
    <meta charset="UTF-8">

    <!--meta viewport - serve para indicar ao navegador como dimensionar a página em dispositivos móveis. (Responsividade).
    content - especifica o conteúdo da meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>

<body>
    Olá, Mundo. Este é meu primeiro programa em HTML.
</body>

</html>
