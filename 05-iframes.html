<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline frame para embutir outros sites">
    <title>Sobre iframes</title>
</head>
<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p>O Inline Frame é um elemento que nos permite embutir outro documento ou conteúdo externo dentro da nossa página. É bastante usado para YouTube, Google Maps, formulários externos e etc.</p>

    <h3>Exemplo básico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="1"></iframe>
    <hr>

    <h3>Carregando o YouTube</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/4Z62lfGyzqo?si=z6nvVD4hpQhoIenn" title="YouTube video player COM VÍDEO SOBRE O MERCADO DEV" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h3>Carregando Mapas</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d117044.64529110752!2d-46.54426574707031!3d-23.54526147119322!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce66dec98fb855%3A0xf2b061ffbcd2ecf8!2sNeo%20Qu%C3%ADmica%20Arena!5e0!3m2!1spt-BR!2sbr!4v1790172364897!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    
</body>
</html>
